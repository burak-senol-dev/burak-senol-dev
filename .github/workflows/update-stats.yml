name: Update Profile Stats SVGs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest SVGs
        run: |
          mkdir -p assets
          curl -s "https://github-readme-stats-anuraghazra1.vercel.app/api?username=burak-senol-dev&show_icons=true&theme=tokyonight&hide_border=true" | sed 's/undefined//g' > assets/stats.svg
          curl -s "https://github-readme-stats-anuraghazra1.vercel.app/api/top-langs/?username=burak-senol-dev&layout=compact&theme=tokyonight&hide_border=true" | sed 's/undefined//g' > assets/langs.svg
          curl -s "https://streak-stats.demolab.com/?user=burak-senol-dev&theme=tokyonight&hide_border=true" > assets/streak.svg

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update GitHub profile stats SVGs [skip ci]"
            git push
          fi
